# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION - BOOKSTACK WIKI CORPORATIVO
# ==============================================================================
# Caminho sugerido no host Linux: /etc/nginx/sites-available/bookstack.conf
# Link simbólico para ativação:
#   sudo ln -s /etc/nginx/sites-available/bookstack.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. BLOCO HTTP (Porta 80) -> REDIRECIONAMENTO COMPULSÓRIO PARA HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name docs.empresa.com.br wiki.empresa.local;

    # Permitir validação do Let's Encrypt / ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirecionamento permanente para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. BLOCO HTTPS (Porta 443) -> TERMINAÇÃO SSL E REVERSE PROXY OTIMIZADO
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.empresa.com.br wiki.empresa.local;

    # --------------------------------------------------------------------------
    # Certificados SSL / TLS
    # (Ajuste para os caminhos do seu certificado corporativo ou Let's Encrypt)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/nginx/ssl/bookstack.crt;
    ssl_certificate_key /etc/nginx/ssl/bookstack.key;

    # Parâmetros SSL Hardened (Mozilla Modern / Intermediate Profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:BookStackSSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling (Habilitar caso utilize CA pública com OCSP)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/ssl/ca-certs.pem;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;
    # resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Cabeçalhos de Segurança (Security Hardening)
    # --------------------------------------------------------------------------
    # HSTS (Força HTTPS por 2 anos)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Prevenção de Clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevenção de MIME Sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Proteção XSS legada em navegadores
    add_header X-XSS-Protection "1; mode=block" always;

    # Controle de Referrer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restrição de APIs de Hardware e Navegador
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Content Security Policy (Compatível com os editores WYSIWYG, Markdown e Diagrams.net do BookStack)
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:;" always;

    # --------------------------------------------------------------------------
    # Ajustes de Upload e Buffers para Documentação Técnica (100MB)
    # --------------------------------------------------------------------------
    client_max_body_size 100M;
    client_body_buffer_size 512k;
    client_body_timeout 300s;
    send_timeout 300s;

    # Otimizações de envio de arquivos
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Logs customizados
    access_log /var/log/nginx/bookstack_access.log;
    error_log /var/log/nginx/bookstack_error.log warn;

    # --------------------------------------------------------------------------
    # Roteamento de Proxy Reverso para o Container BookStack
    # --------------------------------------------------------------------------
    location / {
        # Encaminhamento para a porta local do BookStack mapeada no docker-compose
        proxy_pass http://127.0.0.1:6875;
        proxy_http_version 1.1;

        # Repasse de Cabeçalhos de Origem e Rede (Essencial para CSRF e redirects corretos)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Suporte a WebSockets e Conexões Persistentes
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts de Proxy (Evita HTTP 504 Gateway Timeout durante uploads longos)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering on;
    }

    # Gateway de IA: apenas o NGINX fica exposto; o serviço escuta somente
    # em 127.0.0.1:8000 no host. O endpoint /chat exige X-Chatbot-Token.
    location = /assistente {
        return 301 /assistente/;
    }

    location /assistente/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 90s;
        proxy_buffering off;
        client_max_body_size 32K;
    }

    # Bloqueio de arquivos ocultos sensíveis (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
