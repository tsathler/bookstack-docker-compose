; ==============================================================================
; BOOKSTACK - AJUSTES DE PERFORMANCE E UPLOAD DO PHP (php-local.ini)
; ==============================================================================
; Este arquivo sobrescreve as diretivas padrões do PHP-FPM dentro do container.

; Limite máximo para upload de arquivos individuais
upload_max_filesize = 100M

; Tamanho máximo permitido para requisições POST (deve ser >= upload_max_filesize)
post_max_size = 105M

; Limite máximo de memória alocado por script PHP
memory_limit = 512M

; Tempo máximo de execução de scripts (segundos) para acomodar uploads grandes
max_execution_time = 300

; Tempo máximo que um script pode gastar interpretando dados de input
max_input_time = 300

; Limite de variáveis de input permitidas (previne estouro em formulários grandes)
max_input_vars = 3000

; Fuso horário padrão do PHP
date.timezone = America/Sao_Paulo

; Otimizações do OPcache para produção
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
